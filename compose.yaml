name: lexora

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Lexora: Host=postgres;Port=5432;Database=lexora;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  Persistence__WolverineSchema: wolverine_api
  Jwt__SigningKey: ${JWT_SIGNING_KEY}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lexora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d lexora"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrator:
    build:
      context: .
      dockerfile: src/Hosts/Lexora.Api/Dockerfile
      target: migrator
    environment:
      <<: *dotnet-env
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL}
      Seed__Admin__Name: ${SEED_ADMIN_NAME}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Hosts/Lexora.Api/Dockerfile
      target: final
    environment:
      <<: *dotnet-env
      Swagger__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  seq-data:
