name: lexora

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Lexora: Host=postgres;Port=5432;Database=lexora;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  ConnectionStrings__Redis: redis:6379
  Persistence__WolverineSchema: wolverine_api
  Storage__Provider: S3
  Storage__S3__ServiceUrl: http://seaweedfs:8333
  Storage__S3__PublicUrl: http://localhost:8333
  Storage__S3__Bucket: ${S3_BUCKET}
  Storage__S3__AccessKey: ${S3_ACCESS_KEY}
  Storage__S3__SecretKey: ${S3_SECRET_KEY}
  Storage__S3__ForcePathStyle: "true"
  Jwt__SigningKey: ${JWT_SIGNING_KEY}
  Ai__Chat__DefaultProfile: ${AI_CHAT_PROFILE:-local}
  Ai__Chat__Profiles__local__Endpoint: http://ollama:11434
  Ai__Chat__Profiles__local__Model: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
  Ai__Chat__Profiles__claude__ApiKey: ${ANTHROPIC_API_KEY:-}
  Ai__Chat__Profiles__openai__ApiKey: ${OPENAI_API_KEY:-}
  Ai__Chat__Profiles__groq__ApiKey: ${GROQ_API_KEY:-}
  Ai__Embedding__Profile: ${AI_EMBEDDING_PROFILE:-local}
  Ai__Embedding__Profiles__local__Endpoint: http://ollama:11434
  Ai__Embedding__Profiles__local__Model: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
  Ai__Embedding__Profiles__openai__ApiKey: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lexora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d lexora"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET} || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${S3_BUCKET}
    restart: "no"

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai-local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai-local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3} && ollama pull ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    restart: "no"

  migrator:
    build:
      context: .
      dockerfile: src/Hosts/Lexora.Api/Dockerfile
      target: migrator
    environment:
      <<: *dotnet-env
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL}
      Seed__Admin__Name: ${SEED_ADMIN_NAME}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Hosts/Lexora.Api/Dockerfile
      target: final
    environment:
      <<: *dotnet-env
      Swagger__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/Hosts/Lexora.Worker/Dockerfile
    environment:
      <<: *dotnet-env
      Persistence__WolverineSchema: wolverine_worker
    ports:
      - "5081:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
        required: false

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  seaweedfs-data:
  seq-data:
  ollama-data:
